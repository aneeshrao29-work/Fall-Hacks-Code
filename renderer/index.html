<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>JepiTheGenie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="marks"></div>
  <div id="pointer" aria-hidden="true"><div class="hand"></div></div>
  <div id="fx"></div>
  <div id="banner" class="banner"></div>

  <!-- Jepi + caption: this whole thing flies around the screen -->
  <div class="buddy" id="buddy">
    <div class="bubble" id="bubble" aria-live="polite"><span class="cc">CC</span><span id="caption"></span><div class="acts" id="acts"></div></div>
    <div class="jepi" id="jepi" data-mood="idle" role="button" tabindex="0" aria-label="Jepi. Click for menu, double-click to poke, drag to move.">
      <button class="aura" id="aura" title="aura: your focus score (click for what it means)" aria-label="Aura points">✦<b id="auraVal">0</b></button>
      <div class="spin3d" id="spin3d">
        <svg id="sprite" role="img" aria-label="Jepi the pixel robot"></svg>
        <svg id="spriteBack" aria-hidden="true"></svg>
        <i class="face3 side-l"></i><i class="face3 side-r"></i><i class="face3 lid"></i>
        <i class="face3 port-l"></i><i class="face3 port-t"></i>
      </div>
      <svg id="pieSvg" aria-hidden="true"></svg>
    </div>
  </div>

  <!-- menu: opens next to Jepi when you click it -->
  <div class="dock" id="dock">
    <div class="panel" id="personas" role="radiogroup" aria-label="Persona" hidden>
      <button class="chip" role="radio" data-persona="bestie">💅<br>bestie</button>
      <button class="chip" role="radio" data-persona="brainrot">🧠<br>brainrot</button>
      <button class="chip" role="radio" data-persona="linkedin">💼<br>linkedin</button>
      <button class="chip" role="radio" data-persona="drama">🎭<br>drama</button>
      <button class="chip" role="radio" data-persona="cat">🐱<br>cat</button>
      <button class="chip" role="radio" data-persona="grandma">👵<br>grandma</button>
      <button class="chip" role="radio" data-persona="study">🎓<br>study</button>
    </div>
    <div class="panel closet" id="closet" hidden>
      <div class="slot"><span>hat</span><div class="opts" data-slot="hat"></div></div>
      <div class="slot"><span>face</span><div class="opts" data-slot="face"></div></div>
      <div class="slot"><span>fit</span><div class="opts" data-slot="fit"></div></div>
      <div class="slot"><span>trail</span><div class="opts" data-slot="trail"></div></div>
    </div>

    <nav class="menu" aria-label="Jepi menu">
      <div class="mh">What should I do?</div>
      <div class="mtip">tip: <b>double-tap me</b> to check your code</div>
      <button class="item" id="lookBtn"><span class="ic">🔍</span><span class="lb">Find what's wrong<small>scan my whole screen</small></span><kbd>⌘⇧Space</kbd></button>
      <button class="item" id="wishBtn"><span class="ic">💬</span><span class="lb">Ask a question<small>about anything on screen</small></span><kbd>⌘⇧A</kbd></button>
      <button class="item" id="pickBtn"><span class="ic">🎯</span><span class="lb">Ask about one area<small>drag a box around it</small></span></button>
      <button class="item" id="crashBtn"><span class="ic">🚨</span><span class="lb">Solve the error I copied<small>paste a crash / stack trace</small></span></button>
      <button class="item" id="sylBtn"><span class="ic">📚</span><span class="lb">Syllabus → calendar<small>course PDFs into deadlines</small></span></button>
      <button class="item" id="atsBtn"><span class="ic">📄</span><span class="lb">Resume ATS check<small>score + fixes (open the job post first)</small></span></button>
      <div class="mh">Jepi</div>
      <button class="item" id="personaBtn" aria-expanded="false" aria-controls="personas"><span class="ic">💅</span><span class="lb">Personality<small id="personaName">Gen Z bestie</small></span><span class="chev">›</span></button>
      <button class="item" id="closetBtn" aria-expanded="false" aria-controls="closet"><span class="ic">👕</span><span class="lb">Outfit<small>hats, glasses, trails</small></span><span class="chev">›</span></button>
      <button class="item" id="sleepBtn"><span class="ic">😴</span><span class="lb">Pause<small>stop looking at my screen</small></span></button>
      <button class="item" id="muteBtn"><span class="ic">🔊</span><span class="lb">Sound<small>on</small></span></button>
      <button class="item quit" id="quitBtn"><span class="ic">✕</span><span class="lb">Quit Jepi</span><kbd>⌘⇧Q</kbd></button>
    </nav>
  </div>

  <!-- point & ask: drag a box around whatever you want to ask about -->
  <div id="picker" hidden><div id="pickbox"></div><div class="pickhint">drag a box around what you want to ask about · Esc to cancel</div></div>
  <div id="pickmark" hidden></div>

  <!-- the wish bubble: a clean little prompt that pops out of Jepi -->
  <form id="askForm" class="wish">
    <label for="question" class="sr-only">Ask Jepi about your screen</label>
    <button type="button" class="aim" id="aimBtn" title="ask about one area: drag a box" aria-label="Ask about one area">🎯</button>
    <input id="question" placeholder="ask about your screen…" autocomplete="off" maxlength="4000">
    <button class="btn go" type="submit" title="send (Enter)" aria-label="Send wish">➜</button>
  </form>

  <script src="data.js"></script>
  <script src="sprite.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
</body>
</html>
